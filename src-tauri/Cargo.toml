[package]
name = "kongmin-rein"
version = "0.1.0"
description = "Kongmin Rein - thin desktop shell for DeepSeek Harness"
edition = "2021"

[lib]
name = "kongmin_rein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
